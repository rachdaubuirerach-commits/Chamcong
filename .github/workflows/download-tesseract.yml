name: Download Tesseract Files

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create tesseract folders
        run: |
          mkdir -p tesseract/lang-data

      - name: Download tesseract.min.js
        run: |
          curl -L -o tesseract/tesseract.min.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"

      - name: Download worker.min.js
        run: |
          curl -L -o tesseract/worker.min.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js"

      - name: Download tesseract-core.wasm.js
        run: |
          curl -L -o tesseract/tesseract-core.wasm.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core.wasm.js"

      - name: Download vie.traineddata.gz
        run: |
          curl -L -o tesseract/lang-data/vie.traineddata.gz \
            "https://cdn.jsdelivr.net/npm/tesseract.js-data@5.0.0/vie/vie.traineddata.gz"

      - name: Show files
        run: |
          ls -lah tesseract/
          ls -lah tesseract/lang-data/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesseract/
          git commit -m "Add Tesseract offline files" || echo "No changes"
          git push
