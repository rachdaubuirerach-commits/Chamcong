name: Download Tesseract Files

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create tesseract folders
        run: |
          mkdir -p tesseract/lang-data

      - name: Download tesseract.min.js
        run: |
          curl -fL -o tesseract/tesseract.min.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"

      - name: Download worker.min.js
        run: |
          curl -fL -o tesseract/worker.min.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js"

      - name: Download tesseract-core.wasm.js
        run: |
          curl -fL -o tesseract/tesseract-core.wasm.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core.wasm.js"

      - name: Download tesseract-core-simd.wasm.js
        run: |
          curl -fL -o tesseract/tesseract-core-simd.wasm.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd.wasm.js"

      - name: Download tesseract-core-lstm.wasm.js
        run: |
          curl -fL -o tesseract/tesseract-core-lstm.wasm.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-lstm.wasm.js"

      - name: Download tesseract-core-simd-lstm.wasm.js
        run: |
          curl -fL -o tesseract/tesseract-core-simd-lstm.wasm.js \
            "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd-lstm.wasm.js"

      - name: Download vie.traineddata.gz
        run: |
          curl -fL -o tesseract/lang-data/vie.traineddata.gz \
            "https://raw.githubusercontent.com/naptha/tessdata/gh-pages/4.0.0/vie.traineddata.gz"

      - name: Verify file sizes
        run: |
          echo "=== Checking file sizes ==="
          ls -lah tesseract/
          ls -lah tesseract/lang-data/
          echo ""
          echo "=== Verify traineddata is not empty ==="
          SIZE=$(stat -c%s tesseract/lang-data/vie.traineddata.gz)
          echo "vie.traineddata.gz size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "❌ ERROR: File too small (< 1MB). Download failed!"
            exit 1
          fi
          echo "✅ File size OK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tesseract/
          git commit -m "Add Tesseract core variants" || echo "No changes"
          git push
